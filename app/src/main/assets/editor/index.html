<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexa IDE Professional Code Editor</title>

  <!-- CodeMirror Bundled Stylesheet -->
  <link rel="stylesheet" href="bundle.min.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      color: #c9d1d9;
    }
    #editor-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
    }
    #fallback-textarea {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 12px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Monaco, Consolas, monospace !important;
      font-size: 14px;
      line-height: 20px;
      background-color: #0d1117;
      color: #c9d1d9;
      border: none;
      outline: none;
      resize: none;
      box-sizing: border-box;
      white-space: pre;
      overflow: auto;
      tab-size: 4;
      -webkit-text-fill-color: #c9d1d9;
    }
    .CodeMirror {
      width: 100% !important;
      height: 100% !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Monaco, Consolas, monospace !important;
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: 0;
      background-color: #0d1117 !important;
      color: #c9d1d9 !important;
    }
    .CodeMirror-scroll {
      height: 100% !important;
      overflow-y: auto !important;
      overflow-x: auto !important;
      padding-bottom: 60px !important;
    }

    /* Dark theme customizations (Default: material-darker / Nexa IDE dark) */
    .cm-s-material-darker.CodeMirror {
      background-color: #0d1117 !important;
      color: #c9d1d9 !important;
    }
    .cm-s-material-darker .CodeMirror-gutters {
      background-color: #0d1117 !important;
      border-right: 1px solid #21262d !important;
      color: #484f58 !important;
      padding-right: 4px;
    }
    .cm-s-material-darker .CodeMirror-linenumber {
      color: #484f58 !important;
      padding: 0 6px 0 4px !important;
      min-width: 24px;
      text-align: right;
    }
    .cm-s-material-darker .CodeMirror-activeline-background {
      background: rgba(56, 139, 253, 0.08) !important;
    }
    .cm-s-material-darker .CodeMirror-selected {
      background: rgba(56, 139, 253, 0.35) !important;
    }
    .cm-s-material-darker .CodeMirror-cursor {
      border-left: 2px solid #58a6ff !important;
    }

    /* Light theme adjustments */
    body.theme-light, body.theme-light #editor-container, body.theme-light #fallback-textarea {
      background-color: #ffffff !important;
      color: #24292f !important;
      -webkit-text-fill-color: #24292f !important;
    }
    body.theme-light .cm-s-eclipse.CodeMirror {
      background-color: #ffffff !important;
      color: #24292f !important;
    }
    body.theme-light .cm-s-eclipse .CodeMirror-gutters {
      background-color: #f6f8fa !important;
      border-right: 1px solid #d0d7de !important;
      color: #8c959f !important;
    }
    body.theme-light .cm-s-eclipse .CodeMirror-activeline-background {
      background: rgba(9, 105, 218, 0.08) !important;
    }

    /* Dracula theme adjustments */
    body.theme-dracula, body.theme-dracula #editor-container, body.theme-dracula #fallback-textarea {
      background-color: #282a36 !important;
      color: #f8f8f2 !important;
      -webkit-text-fill-color: #f8f8f2 !important;
    }

    /* Fold gutter styling */
    .CodeMirror-foldgutter-open, .CodeMirror-foldgutter-folded {
      color: #58a6ff !important;
      cursor: pointer;
      font-weight: bold;
      padding: 0 2px;
    }
    .CodeMirror-foldmarker {
      color: #58a6ff;
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 0 4px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    /* Search highlight styling */
    .cm-searching {
      background-color: rgba(255, 215, 0, 0.4) !important;
      border-radius: 2px;
    }
  </style>
</head>
<body class="theme-dark">
  <div id="editor-container">
    <textarea id="fallback-textarea" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Enter code here..."></textarea>
  </div>

  <!-- Single Bundled CodeMirror Core + Addons + Modes -->
  <script src="bundle.min.js"></script>

  <script>
    (function() {
      const container = document.getElementById('editor-container');
      const fallback = document.getElementById('fallback-textarea');
      let cm = null;

      function getModeForLang(lang) {
        const l = (lang || '').toLowerCase().trim();
        switch(l) {
          case 'kotlin':
          case 'kt':
          case 'kts':
            return 'text/x-kotlin';
          case 'java':
            return 'text/x-java';
          case 'groovy':
          case 'gradle':
            return 'text/x-groovy';
          case 'xml':
            return 'application/xml';
          case 'html':
          case 'htm':
            return 'htmlmixed';
          case 'css':
            return 'text/css';
          case 'javascript':
          case 'js':
          case 'ts':
            return 'text/javascript';
          case 'json':
            return 'application/json';
          case 'markdown':
          case 'md':
            return 'text/x-markdown';
          case 'python':
          case 'py':
            return 'text/x-python';
          case 'php':
            return 'application/x-httpd-php';
          case 'sql':
            return 'text/x-sql';
          case 'yaml':
          case 'yml':
            return 'text/x-yaml';
          default:
            return 'text/plain';
        }
      }

      // Initialize CodeMirror safely with fallback protection
      try {
        if (typeof CodeMirror !== 'undefined') {
          cm = CodeMirror(container, {
            value: '',
            mode: 'text/x-kotlin',
            theme: 'material-darker',
            lineNumbers: true,
            styleActiveLine: true,
            matchBrackets: true,
            autoCloseBrackets: true,
            foldGutter: true,
            gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
            lineWrapping: false,
            tabSize: 4,
            indentUnit: 4,
            indentWithTabs: false,
            smartIndent: true,
            inputStyle: 'textarea',
            autofocus: false,
            extraKeys: {
              'Tab': function(instance) {
                if (instance.somethingSelected()) {
                  instance.indentSelection('add');
                } else {
                  instance.replaceSelection('    ', 'end', '+input');
                }
              },
              'Shift-Tab': function(instance) {
                instance.indentSelection('subtract');
              }
            }
          });

          // Successfully created CodeMirror! Hide fallback textarea
          if (fallback) fallback.style.display = 'none';
        } else {
          console.warn('CodeMirror script not ready, using fallback editor.');
          if (fallback) fallback.style.display = 'block';
        }
      } catch (err) {
        console.error('CodeMirror init failed, activating fallback editor:', err);
        cm = null;
        if (fallback) fallback.style.display = 'block';
      }

      // Cursor position reporting
      function reportCursor() {
        try {
          if (cm) {
            const cur = cm.getCursor();
            if (window.AndroidBridge && window.AndroidBridge.onCursorMoved) {
              window.AndroidBridge.onCursorMoved(cur.line + 1, cur.ch + 1);
            }
          } else if (fallback) {
            const pos = fallback.selectionStart || 0;
            const lines = fallback.value.substring(0, pos).split('\n');
            const line = lines.length;
            const col = lines[lines.length - 1].length + 1;
            if (window.AndroidBridge && window.AndroidBridge.onCursorMoved) {
              window.AndroidBridge.onCursorMoved(line, col);
            }
          }
        } catch (e) {
          console.error('reportCursor error:', e);
        }
      }

      if (cm) {
        cm.on('cursorActivity', reportCursor);
        cm.on('change', function(instance, changeObj) {
          try {
            if (changeObj.origin === 'setValue') return;
            if (window.AndroidBridge && window.AndroidBridge.onContentChanged) {
              window.AndroidBridge.onContentChanged(cm.getValue());
            }
          } catch (e) {
            console.error('onChange error:', e);
          }
        });
      }

      if (fallback) {
        fallback.addEventListener('input', function() {
          if (!cm && window.AndroidBridge && window.AndroidBridge.onContentChanged) {
            window.AndroidBridge.onContentChanged(fallback.value);
          }
        });
        fallback.addEventListener('keyup', reportCursor);
        fallback.addEventListener('click', reportCursor);
      }

      container.addEventListener('click', function() {
        if (cm) {
          cm.focus();
        } else if (fallback) {
          fallback.focus();
        }
      });

      window.addEventListener('resize', function() {
        if (cm) cm.refresh();
      });

      // Public API exposed on window for Android Kotlin WebView interop
      window.setCode = function(code, lang) {
        try {
          const text = code || '';
          if (fallback) {
            fallback.value = text;
          }
          if (cm) {
            const targetMode = getModeForLang(lang);
            cm.setOption('mode', targetMode);
            cm.setValue(text);
            cm.clearHistory();
            cm.scrollTo(0, 0);
            cm.setCursor({ line: 0, ch: 0 });
            cm.refresh();
            setTimeout(function() { cm.refresh(); }, 30);
            setTimeout(function() { cm.refresh(); }, 120);
            reportCursor();
          } else {
            if (fallback) fallback.style.display = 'block';
            reportCursor();
          }
        } catch (e) {
          console.error('setCode error:', e);
          if (fallback) {
            fallback.style.display = 'block';
            fallback.value = code || '';
          }
        }
      };

      window.getCode = function() {
        try {
          if (cm) return cm.getValue();
          if (fallback) return fallback.value;
          return '';
        } catch (e) {
          console.error('getCode error:', e);
          return fallback ? fallback.value : '';
        }
      };

      window.setTheme = function(theme) {
        try {
          const t = (theme || 'dark').toLowerCase();
          document.body.className = '';
          if (t === 'light' || t === 'material-light' || t === 'eclipse') {
            document.body.classList.add('theme-light');
            if (cm) cm.setOption('theme', 'eclipse');
          } else if (t === 'dracula') {
            document.body.classList.add('theme-dracula');
            if (cm) cm.setOption('theme', 'dracula');
          } else {
            document.body.classList.add('theme-dark');
            if (cm) cm.setOption('theme', 'material-darker');
          }
          if (cm) cm.refresh();
        } catch (e) {
          console.error('setTheme error:', e);
        }
      };

      window.setFontSize = function(sizePx) {
        try {
          const size = Math.max(10, Math.min(32, Number(sizePx) || 14));
          if (fallback) {
            fallback.style.fontSize = size + 'px';
            fallback.style.lineHeight = (size * 1.4) + 'px';
          }
          if (cm) {
            const el = cm.getWrapperElement();
            if (el) {
              el.style.fontSize = size + 'px';
              cm.refresh();
            }
          }
        } catch (e) {
          console.error('setFontSize error:', e);
        }
      };

      window.setTabSize = function(n) {
        try {
          const size = Math.max(1, Number(n) || 4);
          if (fallback) fallback.style.tabSize = size;
          if (cm) {
            cm.setOption('tabSize', size);
            cm.setOption('indentUnit', size);
            cm.refresh();
          }
        } catch (e) {
          console.error('setTabSize error:', e);
        }
      };

      window.setLineWrapping = function(enabled) {
        try {
          if (fallback) fallback.style.whiteSpace = enabled ? 'pre-wrap' : 'pre';
          if (cm) {
            cm.setOption('lineWrapping', !!enabled);
            cm.refresh();
          }
        } catch (e) {
          console.error('setLineWrapping error:', e);
        }
      };

      window.insertText = function(text) {
        try {
          if (cm) {
            cm.replaceSelection(text || '', 'end');
            cm.focus();
          } else if (fallback) {
            const start = fallback.selectionStart;
            const end = fallback.selectionEnd;
            const val = fallback.value;
            fallback.value = val.substring(0, start) + text + val.substring(end);
            fallback.selectionStart = fallback.selectionEnd = start + text.length;
            fallback.focus();
            if (window.AndroidBridge && window.AndroidBridge.onContentChanged) {
              window.AndroidBridge.onContentChanged(fallback.value);
            }
          }
        } catch (e) {
          console.error('insertText error:', e);
        }
      };

      window.formatCode = function() {
        try {
          if (cm) {
            const totalLines = cm.lineCount();
            cm.operation(function() {
              for (let i = 0; i < totalLines; i++) {
                cm.indentLine(i);
              }
            });
            cm.focus();
          }
        } catch (e) {
          console.error('formatCode error:', e);
        }
      };

      window.gotoLine = function(lineNum) {
        try {
          if (cm) {
            const total = cm.lineCount();
            const target = Math.max(0, Math.min(total - 1, (Number(lineNum) || 1) - 1));
            cm.setCursor({ line: target, ch: 0 });
            cm.scrollIntoView({ line: target, ch: 0 }, 100);
            cm.focus();
            reportCursor();
          }
        } catch (e) {
          console.error('gotoLine error:', e);
        }
      };

      window.findText = function(search, replace, replaceAll) {
        try {
          if (!search) return;
          if (cm) {
            if (replace !== undefined && replace !== null) {
              if (replaceAll) {
                const cur = cm.getSearchCursor(search, { line: 0, ch: 0 });
                cm.operation(function() {
                  while (cur.findNext()) {
                    cur.replace(replace);
                  }
                });
              } else {
                let cur = cm.getSearchCursor(search, cm.getCursor('end'));
                if (!cur.findNext()) {
                  cur = cm.getSearchCursor(search, { line: 0, ch: 0 });
                  cur.findNext();
                }
                if (cur.from()) {
                  cur.replace(replace);
                  cm.setSelection(cur.from(), cur.to());
                  cm.scrollIntoView(cur.from(), 100);
                }
              }
            } else {
              let cur = cm.getSearchCursor(search, cm.getCursor('end'));
              if (!cur.findNext()) {
                cur = cm.getSearchCursor(search, { line: 0, ch: 0 });
                cur.findNext();
              }
              if (cur.from()) {
                cm.setSelection(cur.from(), cur.to());
                cm.scrollIntoView(cur.from(), 100);
              }
            }
            cm.focus();
          } else if (fallback && search) {
            const idx = fallback.value.indexOf(search, fallback.selectionEnd || 0);
            if (idx !== -1) {
              fallback.setSelectionRange(idx, idx + search.length);
              fallback.focus();
            }
          }
        } catch (e) {
          console.error('findText error:', e);
        }
      };

      window.undo = function() {
        try {
          if (cm) { cm.undo(); cm.focus(); }
        } catch (e) {
          console.error('undo error:', e);
        }
      };

      window.redo = function() {
        try {
          if (cm) { cm.redo(); cm.focus(); }
        } catch (e) {
          console.error('redo error:', e);
        }
      };

      window.selectAll = function() {
        try {
          if (cm) {
            cm.execCommand('selectAll');
            cm.focus();
          } else if (fallback) {
            fallback.select();
            fallback.focus();
          }
        } catch (e) {
          console.error('selectAll error:', e);
        }
      };

      // Notify Android that editor is initialized and ready
      function notifyReady() {
        try {
          if (cm) cm.refresh();
          if (window.AndroidBridge && window.AndroidBridge.onEditorReady) {
            window.AndroidBridge.onEditorReady();
          }
        } catch (e) {
          console.error('notifyReady error:', e);
        }
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        notifyReady();
      } else {
        window.addEventListener('DOMContentLoaded', notifyReady);
      }
      setTimeout(notifyReady, 50);
      setTimeout(notifyReady, 200);
    })();
  </script>
</body>
</html>
