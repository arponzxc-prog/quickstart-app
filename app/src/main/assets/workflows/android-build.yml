name: Android CI Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, bundle)'
        required: true
        default: 'debug'
      jdk_version:
        description: 'JDK Version (17, 21)'
        required: false
        default: '17'
      clean_build:
        description: 'Clean project before build (true, false)'
        required: false
        default: 'true'

permissions:
  contents: read

env:
  # Run any remaining JavaScript actions on Node 24 (Node 20 is deprecated on runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ github.event.inputs.jdk_version || '17' }}
          distribution: 'temurin'

      - name: Detect project directory
        id: detect-project
        run: |
          PROJECT_DIR="."
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            FOUND=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -n "$FOUND" ]; then PROJECT_DIR="$FOUND"; fi
          fi
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "[NEXA-ERROR] No settings.gradle(.kts) found in the repository. Cannot locate the Gradle project."
            echo "::error title=Gradle project not found::No settings.gradle(.kts) found in the repository."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "=== Project dir: $PROJECT_DIR ==="
          ls -la "$PROJECT_DIR"
          echo "=== Gradle build files ==="
          find "$PROJECT_DIR" -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle*" \) -not -path "*/build/*"

      - name: Configure Android SDK environment
        run: |
          set -euo pipefail
          fail() { echo "[NEXA-ERROR] $1"; echo "::error title=Android SDK environment::$1"; exit 1; }

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "SDK directory $SDK not found, creating it"
            sudo mkdir -p "$SDK" && sudo chown -R "$(id -u):$(id -g)" "$SDK"
          fi

          # Make sure the cmdline-tools (sdkmanager) exist; the ubuntu-latest image ships them.
          SDKMANAGER=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$c" ]; then SDKMANAGER="$c"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK - downloading Android command-line tools"
            curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              || fail "Could not download Android command-line tools (network blocked?)."
            rm -rf /tmp/cmdline-tools && mkdir -p /tmp/cmdline-tools "$SDK/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          [ -x "$SDKMANAGER" ] || fail "sdkmanager is not executable at $SDKMANAGER"

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "SDKMANAGER=$SDKMANAGER"
          } >> "$GITHUB_ENV"
          {
            echo "$(dirname "$SDKMANAGER")"
            echo "$SDK/platform-tools"
          } >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$SDK"
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --version || fail "sdkmanager failed to start (check the JDK version)."
          echo "Installed platforms:"; ls "$SDK/platforms" 2>/dev/null || echo "(none)"
          echo "Installed build-tools:"; ls "$SDK/build-tools" 2>/dev/null || echo "(none)"

      - name: Detect required SDK components
        id: sdk-detect
        working-directory: ${{ steps.detect-project.outputs.project_dir }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          found = set()          # (major, minor)
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("build", ".gradle", ".git", "node_modules", ".kotlin")]
              if root.count(os.sep) > 4:
                  dirs[:] = []
              for f in files:
                  if f not in ("build.gradle", "build.gradle.kts"):
                      continue
                  path = os.path.join(root, f)
                  try:
                      txt = open(path, encoding="utf-8", errors="replace").read()
                  except OSError:
                      continue
                  txt = re.sub(r"//.*", "", txt)
                  txt = re.sub(r"/\*.*?\*/", "", txt, flags=re.S)
                  # compileSdk { version = release(36) { minorApiLevel = 1 } }
                  for m in re.finditer(r"compileSdk\s*\{\s*version\s*=\s*release\(\s*(\d+)\s*\)(?:\s*\{\s*minorApiLevel\s*=\s*(\d+)\s*\})?", txt):
                      found.add((int(m.group(1)), int(m.group(2) or 0)))
                      print(f"{path}: compileSdk release({m.group(1)}) minor={m.group(2) or 0}")
                  # compileSdk = 35 | compileSdk 35 | compileSdkVersion 35 | compileSdkVersion(35)
                  for m in re.finditer(r"compileSdk(?:Version)?\s*(?:=|\()?\s*[\"']?(?:android-)?(\d+)[\"']?", txt):
                      found.add((int(m.group(1)), 0))
                      print(f"{path}: compileSdk {m.group(1)}")

          if not found:
              print("::warning title=compileSdk not detected::Could not read a numeric compileSdk (version catalog or custom DSL). Installing API 36 as default.")
              found.add((36, 0))

          platforms = sorted({f"android-{M}" + (f".{m}" if m else "") for M, m in found})
          major = max(M for M, _ in found)
          build_tools = f"{major}.0.0"
          print("Required platforms:", platforms)
          print("Build-tools:", build_tools)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("platforms=" + " ".join(platforms) + "\n")
              out.write("build_tools=" + build_tools + "\n")
          PY

      - name: Install Android SDK platforms and build-tools
        env:
          SDK_PLATFORMS: ${{ steps.sdk-detect.outputs.platforms }}
          SDK_BUILD_TOOLS: ${{ steps.sdk-detect.outputs.build_tools }}
        run: |
          set -euo pipefail
          fail() { echo "[NEXA-ERROR] $1"; echo "::error title=Installing SDK platforms failed::$1"; exit 1; }

          # 1. Licenses (yes exits with SIGPIPE, so verify the result instead of the exit code)
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /tmp/sdk-licenses.log 2>&1
          set -e
          tail -n 3 /tmp/sdk-licenses.log || true
          [ -s "$ANDROID_HOME/licenses/android-sdk-license" ] \
            || fail "Android SDK licenses were not accepted (no licenses/android-sdk-license). See /tmp/sdk-licenses.log."

          # 2. Install exactly what the project asks for
          PKGS=("platform-tools" "build-tools;${SDK_BUILD_TOOLS}")
          for p in $SDK_PLATFORMS; do PKGS+=("platforms;$p"); done
          echo "Installing: ${PKGS[*]}"
          set +e
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "${PKGS[@]}" 2>&1 | tee /tmp/sdk-install.log
          rc=${PIPESTATUS[0]}
          set -e

          # 3. sdkmanager can print "Failed to find package" and still exit 0, so verify on disk
          MISSING=""
          for p in $SDK_PLATFORMS; do
            [ -f "$ANDROID_HOME/platforms/$p/android.jar" ] || MISSING="$MISSING platforms;$p"
          done
          [ -d "$ANDROID_HOME/build-tools/${SDK_BUILD_TOOLS}" ] || MISSING="$MISSING build-tools;${SDK_BUILD_TOOLS}"
          [ -d "$ANDROID_HOME/platform-tools" ] || MISSING="$MISSING platform-tools"

          if [ "$rc" -ne 0 ] || [ -n "$MISSING" ]; then
            echo "=== Available platform packages (sdkmanager --list) ==="
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list 2>/dev/null | grep -E "platforms;android-[0-9.]+ " | head -n 25 || true
            fail "sdkmanager exit code $rc; packages not installed:${MISSING:- (none detected, see log)}. Use a compileSdk that exists in the SDK repository (e.g. 35 or 36)."
          fi

          echo "=== SDK ready ==="
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Setup Gradle (bootstrap)
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Prepare Gradle wrapper (project's own Gradle version)
        working-directory: ${{ steps.detect-project.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            GV=""
            if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
              GV=$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -n 1)
            fi
            GV=${GV:-8.14.3}
            echo "Generating Gradle wrapper for version $GV"
            rm -rf /tmp/wrap && mkdir -p /tmp/wrap
            echo "" > /tmp/wrap/settings.gradle
            (cd /tmp/wrap && gradle wrapper --gradle-version "$GV" --distribution-type bin --no-daemon)
            mkdir -p gradle/wrapper
            cp /tmp/wrap/gradlew ./gradlew
            cp /tmp/wrap/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
            if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
              cp /tmp/wrap/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
            fi
          fi
          chmod +x gradlew
          ./gradlew --version

          # AGP 8.x/9.x and Gradle 9 require JDK 17+
          JV=$(java -version 2>&1 | sed -n 's/.*version "\([0-9]*\).*/\1/p' | head -n 1)
          if [ "${JV:-0}" -lt 17 ]; then
            echo "[NEXA-ERROR] JDK $JV is too old for the Android Gradle Plugin. Use jdk_version 17 or 21."
            echo "::error title=Incompatible JDK::JDK $JV is too old. Use 17 or 21."
            exit 1
          fi

      - name: Configure Signing Keystores (Production Secrets or Generated Fallback)
        working-directory: ${{ steps.detect-project.outputs.project_dir }}
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # local.properties lets AGP find the SDK even if env vars are dropped by a tool
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 1. Debug Keystore (guarantee debug builds succeed)
          if [ ! -f debug.keystore ]; then
            echo "Creating debug.keystore for development..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Release Keystore: Use repository secret if provided, otherwise create stable local key
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "Decoding stable production release keystore from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_B64" | base64 --decode > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ]; then
            echo "Generating local upload key (no secret provided)..."
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass android -alias upload \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Upload,O=Nexa,C=US"
          fi

      - name: Build with Gradle
        working-directory: ${{ steps.detect-project.outputs.project_dir }}
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          CLEAN_BUILD: ${{ github.event.inputs.clean_build }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          set -euo pipefail
          BT=$(echo "${BUILD_TYPE:-debug}" | tr '[:upper:]' '[:lower:]')
          case "$BT" in
            release) TASK=assembleRelease ;;
            bundle)  TASK=bundleRelease ;;
            *)       TASK=assembleDebug ;;
          esac

          if [ "${CLEAN_BUILD:-true}" = "true" ]; then
            TASK="clean $TASK"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Running ./gradlew $TASK"
          ./gradlew $TASK --stacktrace --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Verify build output
        working-directory: ${{ steps.detect-project.outputs.project_dir }}
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
        run: |
          set -euo pipefail
          BT=$(echo "${BUILD_TYPE:-debug}" | tr '[:upper:]' '[:lower:]')
          if [ "$BT" = "bundle" ]; then
            FILES=$(find . -path '*/build/outputs/bundle/*' -name '*.aab' | sort)
            KIND="AAB"
          else
            FILES=$(find . -path '*/build/outputs/apk/*' -name '*.apk' -not -name '*androidTest*' | sort)
            KIND="APK"
          fi
          if [ -z "$FILES" ]; then
            echo "[NEXA-ERROR] Gradle finished but no $KIND was produced under */build/outputs/. Contents:"
            find . -path '*/build/outputs/*' -type f | head -n 50 || true
            echo "::error title=No build output::Gradle finished but no $KIND file was found."
            exit 1
          fi
          for f in $FILES; do
            echo "Found $KIND: $f ($(du -h "$f" | cut -f1))"
            unzip -tq "$f" >/dev/null || { echo "[NEXA-ERROR] $f is not a valid zip/$KIND archive."; exit 1; }
          done

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: Android-APK
          path: |
            ${{ steps.detect-project.outputs.project_dir }}/**/build/outputs/apk/**/*.apk
            ${{ steps.detect-project.outputs.project_dir }}/**/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Explain failure
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle-build.log"
          echo "=== Failure diagnosis ==="
          if [ ! -f "$LOG" ]; then
            echo "[NEXA-ERROR] The failure happened before Gradle ran (SDK setup, wrapper or signing step). See the failed step above."
            exit 0
          fi
          chk() { # pattern, message
            if grep -qE "$1" "$LOG"; then echo "[NEXA-ERROR] $2"; echo "::error title=Build failure::$2"; fi
          }
          chk "SDK location not found" "Android SDK location not found. ANDROID_HOME / local.properties sdk.dir was not applied."
          chk "Failed to install the following Android SDK packages|Failed to find (target|Build Tools)|License for package .* not accepted" "Gradle could not auto-install an Android SDK package (license or package missing). Check compileSdk / buildToolsVersion exist."
          chk "requires libraries and applications that depend on it to compile against" "A dependency needs a higher compileSdk than the project uses. Raise compileSdk (and install that platform) or pin the dependency."
          chk "Minimum supported Gradle version" "The Gradle version is too old for the Android Gradle Plugin. Update gradle-wrapper.properties."
          chk "Unsupported class file major version|invalid source release|Unsupported Java" "JDK version incompatible with Gradle/AGP/Kotlin. Use jdk_version 17 or 21."
          chk "Could not resolve|Could not GET|Could not download" "A dependency or plugin could not be resolved from the configured repositories."
          chk "AAPT: error|Android resource linking failed|resource .* not found" "Android resource processing failed (see AAPT lines in the log)."
          chk "(^|\s)e: file://" "Kotlin compilation error (see 'e: file://' lines in the log)."
          echo "--- last error lines from the Gradle log ---"
          grep -nE "What went wrong|Execution failed for task|^e: |error:" "$LOG" | head -n 40 || true

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: Build-Reports-Failure
          path: |
            ${{ runner.temp }}/gradle-build.log
            ${{ steps.detect-project.outputs.project_dir }}/**/build/reports/
          if-no-files-found: ignore
          retention-days: 3
